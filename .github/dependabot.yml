version: 2
updates:
  # Go modules — weekly check, security patches always.
  - package-ecosystem: gomod
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]

  # SPA npm packages.
  #
  # TypeScript is pinned to 6.x on purpose. svelte-check 4.7.x crashes on
  # startup under TypeScript 7 —
  #   TypeError: Cannot read properties of undefined
  #              (reading 'useCaseSensitiveFileNames')
  # — because it reads a typescript API that 7 removed, which takes down
  # `npm run check` and with it the Web CI job. Since every web dep is in one
  # group, an ungated bump drags TypeScript 7 in alongside harmless updates and
  # the whole group goes red (this is exactly what happened to PR #165).
  # Ignoring the major keeps the rest of the group mergeable. Drop this ignore
  # and bump both together once svelte-check supports TypeScript 7.
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web-deps:
        patterns: ["*"]

  # Docs site (VitePress). vite + esbuild advisories target the dev server,
  # which we never expose — the docs build produces static HTML deployed to
  # GitHub Pages. Ignoring them keeps the PR queue useful without forcing
  # a VitePress major-version upgrade.
  - package-ecosystem: npm
    directory: /docs
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: vite
        versions: ["5.x"]
      - dependency-name: esbuild
        versions: ["0.21.x"]

  # GitHub Actions versions.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
