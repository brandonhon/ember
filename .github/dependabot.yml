version: 2
updates:
  # Go modules — weekly check, security patches always.
  - package-ecosystem: gomod
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]

  # SPA npm packages.
  #
  # TypeScript is pinned to 6.x on purpose.
  #
  # svelte-check 4.7.1 crashed outright under TypeScript 7 ("Cannot read
  # properties of undefined (reading 'useCaseSensitiveFileNames')") because it
  # read a typescript API that 7 removed, taking down `npm run check` and the
  # Web CI job with it (this is what redded PR #165).
  #
  # 4.7.4 does support TypeScript 7, but NOT as a drop-in: it requires BOTH
  # TypeScript 6 and 7 installed side by side via an npm alias, plus running
  # svelte-check with --tsgo. That is a build-tooling migration, not a version
  # bump, so it stays out of routine dependency PRs. Verified 2026-07-27 by
  # trying it: svelte-check exits with that requirement message.
  #
  # Because every web dep shares one group, an ungated bump would drag
  # TypeScript 7 in alongside harmless updates and red the whole group.
  # Ignoring the major keeps the rest mergeable. Lift this only as a deliberate
  # migration: install the alias, add --tsgo, then drop the ignore.
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web-deps:
        patterns: ["*"]

  # Docs site (VitePress). vite + esbuild advisories target the dev server,
  # which we never expose — the docs build produces static HTML deployed to
  # GitHub Pages. Ignoring them keeps the PR queue useful without forcing
  # a VitePress major-version upgrade.
  - package-ecosystem: npm
    directory: /docs
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: vite
        versions: ["5.x"]
      - dependency-name: esbuild
        versions: ["0.21.x"]

  # GitHub Actions versions.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly

  # Bundled compose stack. This exists for the Caddy proxy, which is pinned by
  # digest in deploy/docker-compose.yml so the running version is a property of
  # this repo rather than of when a host last pulled. That pin is only as good
  # as the thing that moves it: without this entry a Caddy release — including
  # a security release — would sit unnoticed until someone bumped the digest by
  # hand. Weekly rather than monthly for that reason; a proxy CVE shouldn't wait
  # up to four weeks.
  #
  # Caveat worth knowing: Dependabot does version updates but NOT security
  # updates for docker-compose, so a Caddy advisory raises no alert here. The
  # weekly PR is the whole signal — don't let it sit.
  #
  # Caddy is the only pinned image in deploy/. The ollama/ollama:latest services
  # track the tag, which gives Dependabot no version to compare, so they should
  # stay quiet here.
  - package-ecosystem: docker-compose
    directory: /deploy
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Base images in Dockerfile and Dockerfile.release, also digest-pinned: node
  # and golang for the build stages, busybox and distroless for the runtime.
  # These reach the released binaries and the published container, so the same
  # "a pin needs something to move it" argument applies, with more at stake —
  # an unmoved golang pin means shipping a Go toolchain with known CVEs.
  #
  # Grouped: four images across two files would otherwise open four PRs, and
  # they're reviewed as one question ("is the build still green?"). Ungroup if
  # a single image starts needing to move on its own.
  #
  # `docker` here is the right ecosystem (it reads Dockerfiles); the compose
  # entry above needs `docker-compose`. Same caveat as above — version updates
  # only, no security updates.
  #
  # Before merging one of these, confirm the proposed digest is the multi-arch
  # index rather than one platform's manifest; a per-platform digest only fails
  # on the linux/arm64 leg of a release. CONTRIBUTING.md has the buildx check.
  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]
