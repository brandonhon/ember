version: 2
updates:
  # Go modules — weekly check, security patches always.
  - package-ecosystem: gomod
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]

  # SPA npm packages.
  #
  # TypeScript is pinned to 6.x on purpose.
  #
  # svelte-check 4.7.1 crashed outright under TypeScript 7 ("Cannot read
  # properties of undefined (reading 'useCaseSensitiveFileNames')") because it
  # read a typescript API that 7 removed, taking down `npm run check` and the
  # Web CI job with it (this is what redded PR #165).
  #
  # 4.7.4 does support TypeScript 7, but NOT as a drop-in: it requires BOTH
  # TypeScript 6 and 7 installed side by side via an npm alias, plus running
  # svelte-check with --tsgo. That is a build-tooling migration, not a version
  # bump, so it stays out of routine dependency PRs. Verified 2026-07-27 by
  # trying it: svelte-check exits with that requirement message.
  #
  # Because every web dep shares one group, an ungated bump would drag
  # TypeScript 7 in alongside harmless updates and red the whole group.
  # Ignoring the major keeps the rest mergeable. Lift this only as a deliberate
  # migration: install the alias, add --tsgo, then drop the ignore.
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web-deps:
        patterns: ["*"]

  # Docs site (VitePress). vite + esbuild advisories target the dev server,
  # which we never expose — the docs build produces static HTML deployed to
  # GitHub Pages. Ignoring them keeps the PR queue useful without forcing
  # a VitePress major-version upgrade.
  - package-ecosystem: npm
    directory: /docs
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: vite
        versions: ["5.x"]
      - dependency-name: esbuild
        versions: ["0.21.x"]

  # GitHub Actions versions.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
