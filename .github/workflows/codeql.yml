name: CodeQL

# Replaces GitHub's "default setup" so we can pin triggers to main + PR.
# Default setup ran on every branch push, which meant the docs deploy
# pushing to gh-pages tried (and failed) to analyze a branch that holds
# nothing but built static HTML. Adding this workflow disables default
# setup automatically on the first successful run.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly run on Mondays at 06:00 UTC — matches the cadence default
    # setup used. Catches advisories that ship between commits.
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          # Exclude local dev/build tooling from analysis — it's never shipped
          # or run in CI/prod, so app-grade security rules produce only noise.
          # e.g. web/scripts/capture-demo-data.mjs talks to a localhost
          # self-signed instance and writes its API responses to demo-data.json.
          #
          # NOTE on go/log-injection: this rule flags any user-controlled value
          # reaching a log call, but our production logger is a slog JSON handler
          # (slog.NewJSONHandler, cmd/ember/main.go) and every such call passes the
          # value as a *structured attribute* with a constant message — the handler
          # JSON-escapes attribute values, so newlines/quotes can't forge log lines.
          # Those alerts are dismissed as false positives in the Security tab, NOT
          # excluded here, so a genuine fmt.Sprintf-into-message injection still trips.
          config: |
            paths-ignore:
              - web/scripts/**

      - uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        if: matrix.build-mode == 'autobuild'

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
