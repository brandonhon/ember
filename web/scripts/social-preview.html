<!doctype html>
<!--
  Source for docs/public/social-preview.png — the 1280×640 OG card that
  shows when github.com/brandonhon/ember is shared on Twitter, Slack,
  Discord, etc. Rendered by web/scripts/social-preview.mjs (Playwright).
  Brand colors match the dark theme in web/src/App.svelte; copy and
  screenshots mirror the docs landing page (docs/.vitepress/theme/Landing.vue).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..900&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #15130f;
    --paper-2: #1d1a14;
    --ink: #f0e9da;
    --muted: #b8ac95;
    --ember: #e8643a;
    --ember-deep: #c2451d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse at 22% 35%, rgba(232, 100, 58, 0.22), transparent 55%),
      radial-gradient(ellipse at 100% 100%, rgba(194, 69, 29, 0.18), transparent 60%),
      var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    display: grid;
    grid-template-columns: 500px 1fr;
    align-items: center;
    padding: 64px 0 64px 72px;
  }
  .left { display: flex; flex-direction: column; gap: 24px; }
  .brand { display: flex; align-items: center; gap: 24px; }
  .logo { width: 96px; height: 96px; }
  .wordmark {
    font-family: "Fraunces", "Times New Roman", serif;
    font-size: 112px;
    font-weight: 600;
    line-height: 0.95;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  .tagline {
    font-family: "Fraunces", "Times New Roman", serif;
    font-size: 40px;
    font-weight: 500;
    font-style: italic;
    line-height: 1.15;
    color: var(--ink);
    margin-top: 8px;
    max-width: 520px;
  }
  .subline {
    font-size: 22px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.01em;
    margin-top: 16px;
  }
  .subline .dot {
    color: var(--ember);
    margin: 0 10px;
    font-weight: 700;
  }
  .footer {
    margin-top: 28px;
    font-size: 18px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .footer .accent { color: var(--ember); }
  .tagline .accent { color: var(--ember); }

  /* Right column: real screenshots (dark captures) — the desktop
     three-pane reader with the phone view overlapping its corner, the same
     composition as the landing-page hero. */
  .right { position: relative; height: 512px; }
  .shot {
    position: absolute;
    border: 1px solid rgba(240, 233, 218, 0.12);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
    display: block;
  }
  .desktop { width: 640px; top: 40px; left: 24px; border-radius: 12px; }
  .phone { width: 168px; height: 340px; object-fit: cover; object-position: top; top: 150px; left: 8px; border-radius: 22px; border-width: 4px; border-color: #2a261f; }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="emb" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e8643a"/>
            <stop offset="1" stop-color="#c2451d"/>
          </linearGradient>
        </defs>
        <circle cx="13" cy="15" r="6.5" fill="url(#emb)"/>
        <rect x="25" y="11.5" width="31" height="8" rx="4" fill="#f0e9da"/>
        <rect x="8"  y="28"   width="48" height="8" rx="4" fill="#f0e9da"/>
        <rect x="8"  y="44.5" width="34" height="8" rx="4" fill="url(#emb)"/>
      </svg>
      <div class="wordmark">Ember</div>
    </div>
    <div class="tagline">Your feeds. Your server.<br /><span class="accent">Your summaries.</span></div>
    <div class="subline">
      Self-hosted RSS <span class="dot">·</span> Optional AI summaries<br />
      Open source <span class="dot">·</span> Live demo, no install
    </div>
    <div class="footer"><span class="accent">ember-rss.com</span></div>
  </div>

  <div class="right">
    <img class="shot desktop" src="../../docs/public/screenshots/hero-2-threepane-summary-dark.png" alt="" />
    <img class="shot phone" src="../../docs/public/screenshots/reader-mobile-dark.png" alt="" />
  </div>
</body>
</html>
