name: ember

services:
  caddy:
    # Pinned by digest, not by the floating `caddy:2-alpine` tag, so a rebuild
    # can't silently change the proxy version in either direction. The tag is
    # kept alongside the digest purely so the version is readable here; Docker
    # resolves the digest and ignores it. Bumping is manual — see
    # "Pin the image digest" in docs/caddy-hardening.md.
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    # Override EMBER_HTTP_PORT / EMBER_HTTPS_PORT in .env when 80/443 are
    # already taken on the host. Container-side stays 80/443 so Caddy's
    # automatic-HTTPS defaults keep working unchanged.
    ports:
      - "${EMBER_HTTP_PORT:-80}:80"
      - "${EMBER_HTTPS_PORT:-443}:443"
    environment:
      # Hostname + ACME email are substituted into the Caddyfile at runtime.
      # Real DNS name + valid email + public 80/443 → automatic Let's Encrypt.
      EMBER_HOSTNAME: ${EMBER_HOSTNAME:-localhost}
      CADDY_EMAIL: ${CADDY_EMAIL:-admin@localhost}
      # Translate a boolean .env knob into a Caddyfile directive. When
      # EMBER_DISABLE_HTTPS_REDIRECT is set to anything non-empty the
      # substitution expands to `auto_https disable_redirects`, turning off
      # the default 80 → 443 redirect (useful when fronted by another
      # reverse proxy that already terminates TLS). Empty / unset → no
      # change, default redirect stays on.
      EMBER_HTTPS_REDIRECT_DIRECTIVE: ${EMBER_DISABLE_HTTPS_REDIRECT:+auto_https disable_redirects}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
    depends_on:
      ember:
        condition: service_healthy

  ember:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Stamps the binary's reported version (About → Settings, /metrics).
        # Defaults to "dev"; pass the real one at build time, e.g.
        #   EMBER_VERSION=$(git describe --tags --always --dirty) docker compose up -d --build ember
        # Released images get the git tag injected by release.yml.
        VERSION: ${EMBER_VERSION:-dev}
    restart: unless-stopped
    environment:
      EMBER_ADDR: ":8080"
      EMBER_DB_PATH: /data/ember.db
      EMBER_SESSION_KEY: ${EMBER_SESSION_KEY:?must be set in .env}
      EMBER_ADMIN_USER: ${EMBER_ADMIN_USER:-admin}
      EMBER_ADMIN_PASSWORD: ${EMBER_ADMIN_PASSWORD:?must be set in .env}
      EMBER_OLLAMA_URL: http://ollama:11434
      EMBER_OLLAMA_MODEL: ${EMBER_OLLAMA_MODEL:-qwen2.5:0.5b}
      EMBER_FRESH_WINDOW: ${EMBER_FRESH_WINDOW:-6h}
      EMBER_POLL_CONCURRENCY: ${EMBER_POLL_CONCURRENCY:-8}
      EMBER_POLL_TICK: ${EMBER_POLL_TICK:-60s}
      EMBER_LOG_LEVEL: ${EMBER_LOG_LEVEL:-info}
      # Caddy fronts ember on the compose 'frontend' bridge and forwards
      # X-Real-IP + X-Forwarded-Proto. Trust that private range so per-client
      # rate limiting keys on the real client IP and HSTS is emitted for HTTPS.
      # Docker user-defined bridge subnets live in 172.16.0.0/12 by default.
      EMBER_TRUSTED_PROXIES: ${EMBER_TRUSTED_PROXIES:-172.16.0.0/12}

      # Everything below is optional and passed straight through from .env.
      # An unset (or commented-out) line arrives as an empty string, which
      # every reader in internal/config treats as "not set" — so the binary's
      # built-in default applies and behavior is unchanged. See
      # docs/configuration.md for the full table.

      # Canonical scheme://host users reach Ember on. Required for passkey /
      # WebAuthn sign-in — without it the RP ID can't be derived and passkeys
      # stay off.
      EMBER_PUBLIC_URL: ${EMBER_PUBLIC_URL:-}
      EMBER_PASSKEY_REQUIRE_UV: ${EMBER_PASSKEY_REQUIRE_UV:-}

      # Summarization. These seed the boot-time defaults only; Settings →
      # Language model overrides them at runtime and the stored value wins
      # from then on.
      EMBER_DISABLE_SUMMARIES: ${EMBER_DISABLE_SUMMARIES:-}
      EMBER_SUMMARY_BACKEND: ${EMBER_SUMMARY_BACKEND:-}
      EMBER_SUMMARY_BASE_URL: ${EMBER_SUMMARY_BASE_URL:-}
      EMBER_SUMMARY_API_KEY: ${EMBER_SUMMARY_API_KEY:-}
      EMBER_SUMMARY_MODEL: ${EMBER_SUMMARY_MODEL:-}
      EMBER_SUMMARY_GRACE_SECONDS: ${EMBER_SUMMARY_GRACE_SECONDS:-}
      EMBER_SUMMARY_TIMEOUT_SECONDS: ${EMBER_SUMMARY_TIMEOUT_SECONDS:-}

      # Outbound SMTP for the daily digest. Also settable in Settings →
      # Email / SMTP, which takes precedence once saved.
      EMBER_SMTP_HOST: ${EMBER_SMTP_HOST:-}
      EMBER_SMTP_PORT: ${EMBER_SMTP_PORT:-}
      EMBER_SMTP_USER: ${EMBER_SMTP_USER:-}
      EMBER_SMTP_PASSWORD: ${EMBER_SMTP_PASSWORD:-}
      EMBER_SMTP_FROM: ${EMBER_SMTP_FROM:-}
      EMBER_SMTP_STARTTLS: ${EMBER_SMTP_STARTTLS:-}

      # Inbound newsletter inbox. Setting the domain starts the SMTP
      # listener inside the container; mail still has to reach it — this
      # stack publishes no port for it. See docs/email-inbox.md.
      EMBER_EMAIL_DOMAIN: ${EMBER_EMAIL_DOMAIN:-}
      EMBER_EMAIL_LISTEN_ADDR: ${EMBER_EMAIL_LISTEN_ADDR:-}
      EMBER_EMAIL_MAX_BYTES: ${EMBER_EMAIL_MAX_BYTES:-}

      # Remaining knobs.
      EMBER_SESSION_TTL: ${EMBER_SESSION_TTL:-}
      EMBER_POLL_MIN_INTERVAL: ${EMBER_POLL_MIN_INTERVAL:-}
      EMBER_DISABLE_IMAGES: ${EMBER_DISABLE_IMAGES:-}
      EMBER_DISABLE_UPDATE_CHECK: ${EMBER_DISABLE_UPDATE_CHECK:-}
      EMBER_ALLOW_PRIVATE_URLS: ${EMBER_ALLOW_PRIVATE_URLS:-}
      # Caddy terminates TLS in front, so leave these alone unless you have
      # a deliberate plain-HTTP deployment (SECURE_COOKIES=0) or the domain
      # is submitted to the HSTS preload list (HSTS_PRELOAD=1).
      EMBER_SECURE_COOKIES: ${EMBER_SECURE_COOKIES:-}
      EMBER_HSTS_PRELOAD: ${EMBER_HSTS_PRELOAD:-}
    volumes:
      - ember-data:/data
    networks:
      - frontend
      - backend
    healthcheck:
      # The distroless image has no shell/curl/wget, so we re-exec the binary
      # with `version` — it exits 0 cleanly which is enough to indicate the
      # filesystem and process tree are healthy. A real /healthz HTTP probe
      # would require a busybox sidecar; not worth the surface for now.
      test: ["CMD", "/ember", "version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      # backend: ember talks to it. frontend (NOT internal): the daemon
      # needs egress to registry.ollama.ai to download models. No `ports:`
      # are mapped, so the daemon is still unreachable from outside the host.
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # One-shot model pull. Runs once, exits, then stays "completed". Compose
  # `up` will start it but not block on it; the first poll cycle after model
  # download will succeed.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    networks:
      - backend
      - frontend  # needs egress to registry.ollama.ai
    environment:
      # Both the wait loop and the pull need to target the sibling container;
      # without this env, `ollama list` hits 127.0.0.1:11434 inside the pull
      # container (no daemon there) and the loop spins forever.
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull "${EMBER_OLLAMA_MODEL:-qwen2.5:0.5b}"
    depends_on:
      ollama:
        condition: service_started

networks:
  frontend:
  backend:
    internal: true

volumes:
  ember-data:
  ollama-models:
  caddy-data:
  caddy-config:
